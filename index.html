    <style>
        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent; }

        body { background-color: #121214; color: #fff; display: flex;
               justify-content: center; min-height: 100vh; padding: 15px; }

        .container { width: 100%; max-width: 480px; display: flex;
                     flex-direction: column; align-items: center; gap: 18px; }

        .header { display: flex; align-items: center; width: 100%; gap: 12px; margin-top: 10px; }
        .app-icon { width: 45px; height: 45px;
            background: linear-gradient(135deg, #1e88e5, #8e24aa);
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 22px;
            box-shadow: 0 4px 12px rgba(142, 36, 170, 0.3); flex-shrink: 0; }
        .app-title h1 { font-size: 22px; font-weight: bold; }
        .app-title span { font-size: 12px; color: #8a8a93; }

        .card { background-color: #1c1c24; border-radius: 18px; padding: 16px;
                width: 100%; display: flex; flex-direction: column; gap: 12px;
                border: 1px solid #2a2a36; }

        .input-box { width: 100%; background-color: #272733; border: 1px solid #3a3a4c;
            border-radius: 10px; padding: 12px; color: #fff; font-size: 14px;
            outline: none; direction: ltr; text-align: left;
            transition: border-color 0.25s ease, box-shadow 0.25s ease; }
        .input-box::placeholder { color: #727280; }
        .input-box.flash {
            border-color: #0091ff;
            box-shadow: 0 0 0 3px rgba(0,145,255,0.25);
        }

        .controls-row { display: flex; gap: 10px; }

        .btn-paste { flex: 1; background-color: #0091ff; color: white; border: none;
            border-radius: 10px; padding: 12px; font-weight: bold; font-size: 15px;
            cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-paste:active { opacity: 0.8; transform: scale(0.98); }
        .btn-paste i { font-size: 13px; }

        .select-quality { flex: 1; background-color: #272733; color: #60a5fa;
            border: 1px solid #3a3a4c; border-radius: 10px; padding: 12px;
            font-weight: bold; font-size: 14px; outline: none;
            text-align: center; cursor: pointer; }

        .btn-download { width: 100%;
            background: linear-gradient(90deg, #a855f7, #9333ea);
            color: white; border: none; border-radius: 25px; padding: 14px;
            font-weight: bold; font-size: 17px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); transition: 0.2s; }
        .btn-download:active { transform: scale(0.98); }
        .btn-download:disabled { background: #4a4a5a; cursor: not-allowed; box-shadow: none; }

        .progress-container { display: none; flex-direction: column; gap: 8px;
            margin-top: 4px; padding: 12px 14px;
            background: #18181f; border-radius: 12px; border: 1px solid #2a2a36; }
        .progress-container.show { display: flex; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); }
                            to { opacity: 1; transform: translateY(0); } }

        .progress-header { display: flex; justify-content: space-between;
            align-items: center; font-size: 13px; }
        .progress-header .label { color: #d1d1d6; font-weight: 600;
            display: flex; align-items: center; gap: 6px; }
        .progress-header .label i { color: #a855f7; font-size: 12px; }
        .progress-header .percent { color: #fff; font-weight: bold;
            font-variant-numeric: tabular-nums; font-size: 14px; }

        .progress-bar { width: 100%; height: 10px; background: #272733;
            border-radius: 6px; overflow: hidden; position: relative; }

        .progress-fill { height: 100%; width: 0%;
            background: linear-gradient(90deg, #a855f7 0%, #d946ef 40%, #ef4444 100%);
            border-radius: 6px; transition: width 0.35s ease;
            position: relative; overflow: hidden;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5),
                        0 0 20px rgba(168, 85, 247, 0.3); }
        .progress-fill::after { content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            animation: shimmer 1.6s infinite; }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-container.indeterminate .progress-fill {
            width: 40% !important;
            animation: indeterminate 1.4s ease-in-out infinite;
        }
        @keyframes indeterminate {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(80%); }
            100% { transform: translateX(-100%); }
        }

        .progress-info { display: flex; justify-content: space-between;
            font-size: 11px; color: #8a8a93;
            font-variant-numeric: tabular-nums; }
        .progress-info span { display: flex; align-items: center; gap: 4px; }
        .progress-info i { font-size: 10px; color: #60a5fa; }

        .section-title { width: 100%; font-size: 15px; font-weight: bold;
            color: #d1d1d6; margin-top: 5px; display: flex;
            justify-content: space-between; align-items: center; }

        .history-card { background-color: #1c1c24; border-radius: 18px;
            padding: 16px; width: 100%; min-height: 200px; max-height: 320px;
            overflow-y: auto; border: 1px solid #2a2a36;
            display: flex; flex-direction: column; gap: 10px; }

        .history-item { background-color: #272733; padding: 10px 12px;
            border-radius: 8px; font-size: 13px; display: flex;
            justify-content: space-between; align-items: center;
            gap: 8px; transition: 0.15s; }
        .history-item:hover { background-color: #2e2e3d; }

        .history-name { max-width: 65%; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; cursor: pointer; display: flex;
            align-items: center; gap: 6px; flex: 1; }
        .history-actions { display: flex; align-items: center; gap: 10px;
            flex-shrink: 0; }
        .history-actions i { cursor: pointer; color: #a855f7; font-size: 13px;
            padding: 4px; transition: 0.15s; }
        .history-actions i:hover { color: #c084fc; }

        .empty-history { color: #63636e; text-align: center;
            margin: auto; font-size: 13px; }

        .platforms-container { width: 100%; display: flex;
            flex-direction: column; align-items: center; gap: 14px; margin-top: 10px; }
        .platforms-title { font-size: 13px; color: #8a8a93; }

        .icons-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

        .platform-box { display: flex; flex-direction: column; align-items: center;
            gap: 6px; transition: transform 0.25s ease; }

        .icon-btn { width: 46px; height: 46px; border-radius: 14px;
            background-color: #1c1c24; display: flex; align-items: center;
            justify-content: center; border: 1.5px solid #2a2a36;
            transition: all 0.3s ease; position: relative; }
        .icon-btn svg { width: 22px; height: 22px; fill: #b8b8c4;
            transition: fill 0.3s ease; }

        .platform-box[data-platform="x"] .icon-btn:hover svg { fill: #ffffff; }
        .platform-box[data-platform="tiktok"] .icon-btn:hover svg { fill: #00f2fe; }
        .platform-box[data-platform="instagram"] .icon-btn:hover svg { fill: #e1306c; }
        .platform-box[data-platform="facebook"] .icon-btn:hover svg { fill: #1877f2; }
        .platform-box[data-platform="youtube"] .icon-btn:hover svg { fill: #ff0000; }

        .platform-box.active .icon-btn {
            border-color: #ffffff;
            background-color: #26262f;
            box-shadow: 0 0 14px rgba(255,255,255,0.85),
                        0 0 28px rgba(255,255,255,0.5),
                        0 0 46px rgba(255,255,255,0.25),

            transform: scale(1.1);
            animation: glowPulse 2s ease-in-out infinite;
        }
        .platform-box.active .icon-btn svg { fill: #ffffff; filter: drop-shadow(0 0 4px rgba(255,255,255,0.8)); }
        .platform-box.active span { color: #ffffff; font-weight: 600;
            text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .platform-box.active { transform: translateY(-2px); }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 14px rgba(255,255,255,0.85),
                                   0 0 28px rgba(255,255,255,0.5),
                                   0 0 46px rgba(255,255,255,0.25),
                                   inset 0 0 10px rgba(255,255,255,0.15); }
            50% { box-shadow: 0 0 20px rgba(255,255,255,1),
                              0 0 40px rgba(255,255,255,0.7),
                              0 0 60px rgba(255,255,255,0.4),
                              inset 0 0 14px rgba(255,255,255,0.25); }

        .subscribe-banner {

        @keyframes subShimmer {

            100% { transform: translateX(100%); }

        .subscribe-banner:active { transform: scale(0.98); }

        .sub-logo { width: 44px; height: 44px; border-radius: 12px;

        .sub-content { flex: 1; display: flex; flex-direction: column;

        .sub-title { font-size: 15px; font-weight: bold; color: #fff;

        .sub-subtitle { font-size: 11px; color: #a08e95; }

        .sub-btn { background: linear-gradient(135deg, #ff0000, #cc0000);
            color: #fff; border: none; border-radius: 20px;
            padding: 8px 16px; font-size: 13px; font-weight: bold;
            display: flex; align-items: center; gap: 6px;

            box-shadow: 0 4px 12px rgba(255,0,0,0.4);
            animation: bellPulse 2.2s ease-in-out infinite; }
        .sub-btn i { font-size: 12px; }
        @keyframes bellPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 12px rgba(255,0,0,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 4px 20px rgba(255,0,0,0.7); }

        .footer { font-size: 13px; color: #0091ff; margin-top: 4px;

        .footer:hover { background: rgba(0,145,255,0.18);

        .footer i { font-size: 12px; }

        .spinner { display: inline-block; width: 16px; height: 16px;
            border: 2.5px solid rgba(255,255,255,.3); border-radius: 50%;
            border-top-color: #fff; animation: spin 0.9s linear infinite;
            vertical-align: middle; margin-left: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast { position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(120%);
            background: #272733; color: #fff; padding: 12px 20px;
            border-radius: 12px; border: 1px solid #3a3a4c;
            font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.5);
            opacity: 0; transition: all 0.3s ease; z-index: 9999;
            max-width: 90vw; text-align: center; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #ef4444; }
        .toast.info { border-color: #0091ff; }
    </style>
</head>

    <script>
        // ============ Toast ============
        let toastTimer = null;
        function showToast(msg, type = '', duration = 2800) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.className = 'toast ' + type; }, duration);
        }

        // ============ Platform Detection ============
        function detectPlatform(url) {
            if (!url) return null;
            const u = url.toLowerCase();
            if (u.includes('tiktok')) return 'tiktok';
            if (u.includes('x.com') || u.includes('twitter')) return 'x';
            if (u.includes('instagram')) return 'instagram';
            if (u.includes('facebook') || u.includes('fb.watch') || u.includes('fb.com')) return 'facebook';
            if (u.includes('youtube') || u.includes('youtu.be')) return 'youtube';
            return null;
        }

        function updatePlatformGlow() {
            const url = document.getElementById('videoUrl').value.trim();
            const platform = detectPlatform(url);
            document.querySelectorAll('.platform-box').forEach(box => {
                if (platform && box.dataset.platform === platform) {
                    box.classList.add('active');
                } else {
                    box.classList.remove('active');
                }
            });
        }

        // ============ Robust Paste (multi-layer fallback) ============
        async function pasteClipboard() {
            const input = document.getElementById('videoUrl');
            const isSecure = window.isSecureContext;

            // ---- Layer 1: Modern Clipboard API (needs HTTPS or localhost) ----
            if (isSecure && navigator.clipboard && navigator.clipboard.readText) {
                try {
                    // Request permission gracefully if available
                    if (navigator.permissions && navigator.permissions.query) {
                        try {
                            await navigator.permissions.query({ name: 'clipboard-read' });
                        } catch (_) { /* بعض المتصفحات لا تدعم الاستعلام */ }
                    }

                    const text = await navigator.clipboard.readText();
                    if (text && text.trim()) {
                        input.value = text.trim();
                        updatePlatformGlow();
                        flashInput();
                        showToast('✅ تم لصق الرابط', 'success', 1500);
                        return;
                    } else {
                        showToast('📋 الحافظة فارغة', 'info', 1800);
                        return;
                    }
                } catch (err) {
                    console.warn('Clipboard API failed:', err);
                    // نكمل للطبقات التالية
                }
            }

            // ---- Layer 2: execCommand('paste') fallback ----
            try {
                input.focus();
                input.select();
                // eslint-disable-next-line no-undef
                const ok = document.execCommand && document.execCommand('paste');
                if (ok && input.value.trim()) {
                    updatePlatformGlow();
                    flashInput();
                    showToast('✅ تم لصق الرابط', 'success', 1500);
                    return;
                }
            } catch (err) {
                console.warn('execCommand paste failed:', err);
            }

            // ---- Layer 3: Focus + manual paste instructions ----
            input.focus();
            flashInput();

            // لو الجهاز موبايل نرفع الكيبورد، ولو ديسكتوب نرشد المستخدم للاختصار
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            if (isMobile) {
                showToast('الصق الرابط يدوياً من قائمة "لصق" 👆', 'info', 3200);
            } else {
                showToast('اضغط Ctrl+V (أو ⌘V) للصق الرابط', 'info', 3200);
            }
        }

        function flashInput() {
            const input = document.getElementById('videoUrl');
            input.classList.add('flash');
            setTimeout(() => input.classList.remove('flash'), 900);
        }

        // ============ Progress ============
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const progressLabel = document.getElementById('progressLabel');
        const progressSize = document.getElementById('progressSize');
        const progressSpeed = document.getElementById('progressSpeed');
        const progressEta = document.getElementById('progressEta');

        function formatBytes(b) {
            if (!b || b < 0) return '0 B';
            if (b < 1024) return b.toFixed(0) + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
            return (b / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function formatEta(sec) {
            if (!sec || sec <= 0 || !isFinite(sec)) return '--:--';
            sec = Math.round(sec);
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            if (m >= 60) {
                const h = Math.floor(m / 60);
                return `${h}:${String(m % 60).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function showProgress() {
            progressContainer.classList.add('show');
            progressContainer.classList.add('indeterminate');
            progressFill.style.width = '40%';
            progressPercent.textContent = '0%';
            progressLabel.textContent = 'جاري التحضير...';
            progressSize.textContent = '-- / --';
            progressSpeed.textContent = '--';
            progressEta.textContent = '--:--';
        }

        function hideProgress() {
            progressContainer.classList.remove('show');
        }

        function renderProgress(data) {
            const status = data.status || 'pending';

            if (status === 'preparing' || status === 'pending') {
                progressContainer.classList.add('indeterminate');
                progressLabel.textContent = 'جاري التحضير...';
                progressPercent.textContent = '0%';
                return;
            }

            if (status === 'downloading') {
                progressContainer.classList.remove('indeterminate');
                const pct = Math.min(100, Math.max(0, data.percent || 0));
                progressFill.style.width = pct + '%';
                progressPercent.textContent = pct.toFixed(1) + '%';
                progressLabel.textContent = 'جاري التحميل...';

                if (data.total) {
                    progressSize.textContent = `${formatBytes(data.downloaded)} / ${formatBytes(data.total)}`;
                } else {
                    progressSize.textContent = formatBytes(data.downloaded);
                }

                progressSpeed.textContent = data.speed ? formatBytes(data.speed) + '/s' : '--';
                progressEta.textContent = formatEta(data.eta);
                return;
            }

            if (status === 'processing') {
                progressContainer.classList.remove('indeterminate');
                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';
                progressLabel.textContent = 'جاري المعالجة...';
                return;
            }

            if (status === 'done') {
                progressContainer.classList.remove('indeterminate');
                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';
                progressLabel.textContent = 'اكتمل التحميل ✓';
                progressEta.textContent = '00:00';
                return;
            }
        }

        let pollInterval = null;

        async function pollProgress(jobId) {
            try {
                const r = await fetch(`/progress/${jobId}`);
                if (!r.ok) return;
                const data = await r.json();
                renderProgress(data);
            } catch (e) { /* ignore */ }
        }

        // ============ Download ============
        async function startDownload() {
            const urlInput = document.getElementById('videoUrl');
            const qualitySelect = document.getElementById('qualitySelect');
            const btn = document.getElementById('downloadBtn');
            const url = urlInput.value.trim();

            if (!url) {
                showToast('يرجى إدخال رابط الفيديو أولاً!', 'error');
                flashInput();
                return;
            }

            const quality = qualitySelect.value === 'mp3' ? 'best' : qualitySelect.value;
            const format = qualitySelect.value === 'mp3' ? 'mp3' : 'mp4';
            const jobId = 'job_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> جاري التحميل...';

            showProgress();
            pollInterval = setInterval(() => pollProgress(jobId), 500);
            pollProgress(jobId);

            try {
                const extractUrl = `/extract?url=${encodeURIComponent(url)}&quality=${quality}&format=${format}&job_id=${jobId}`;
                const response = await fetch(extractUrl);
                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'فشل تحميل الفيديو من السيرفر');
                }

                renderProgress({ status: 'done', percent: 100 });
                await new Promise(r => setTimeout(r, 400));

                triggerFileDownload(data.file_id);
                addToHistory(data.file_id, data.filename, url, data.size || 0);

                urlInput.value = '';
                updatePlatformGlow();
                showToast('✅ تم التحميل بنجاح', 'success');
                setTimeout(hideProgress, 1500);

            } catch (err) {
                showToast('حدث خطأ: ' + err.message, 'error');
                setTimeout(hideProgress, 800);
            } finally {
                clearInterval(pollInterval);
                pollInterval = null;
                btn.disabled = false;
                btn.innerText = 'تحميل';
            }
        }

        function triggerFileDownload(fileId) {
            const a = document.createElement('a');
            a.href = `/file/${fileId}`;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function openPreview(fileId) {
            window.open(`/preview/${fileId}`, '_blank');
        }

        // ============ History ============
        function formatSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function addToHistory(fileId, name, url, size) {
            let history = JSON.parse(localStorage.getItem('nexdrop_history') || '[]');
            history.unshift({
                fileId, name, url, size: size || 0,
                date: new Date().toLocaleString('ar-EG', {
                    hour: '2-digit', minute: '2-digit',
                    day: '2-digit', month: '2-digit'
                })
            });
            if (history.length > 30) history.pop();
            localStorage.setItem('nexdrop_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('nexdrop_history') || '[]');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">لا توجد تحميلات سابقة</div>';
                return;
            }

            historyList.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';

                const sizeText = item.size ? ` • ${formatSize(item.size)}` : '';
                const isAudio = /\.(mp3|m4a|opus|ogg|wav)$/i.test(item.name || '');
                const iconClass = isAudio ? 'fa-music' : 'fa-file-video';
                const iconColor = isAudio ? '#60a5fa' : '#a855f7';

                div.innerHTML = `
                    <div class="history-name" onclick="openPreview('${item.fileId}')" title="اضغط للمعاينة">
                        <i class="fa-solid ${iconClass}" style="color:${iconColor};"></i>
                        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(item.name)}</span>
                    </div>
                    <div class="history-actions">
                        <small style="color:#727280;">${item.date}${sizeText}</small>
                        <i class="fa-solid fa-eye" title="معاينة" onclick="openPreview('${item.fileId}')"></i>
                        <i class="fa-solid fa-download" title="تنزيل" onclick="triggerFileDownload('${item.fileId}')"></i>
                    </div>
                `;
                historyList.appendChild(div);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[s]));
        }

        function clearHistory() {
            if (confirm('هل تريد مسح السجل بالكامل؟')) {
                localStorage.removeItem('nexdrop_history');
                renderHistory();
            }
        }

        // ============ Init ============
        renderHistory();
        updatePlatformGlow();

        document.getElementById('videoUrl').addEventListener('input', updatePlatformGlow);
        document.getElementById('videoUrl').addEventListener('paste', () => {
            setTimeout(updatePlatformGlow, 30);
        });
        document.getElementById('videoUrl').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startDownload();
        });
    </script>
</body>
</html>
